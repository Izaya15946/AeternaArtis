<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Aeterna Artis |</title>
    <link rel="shortcut icon" href="pics/logo/finishlogo2.0.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="Login.css">

    <!-- Firebase SDK Initialization -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBIefhfw87VtaK_BtSHli0OPAksm1wqQ1s",
            authDomain: "aeterna-artis-618a2.firebaseapp.com",
            projectId: "aeterna-artis-618a2",
            storageBucket: "aeterna-artis-618a2.firebasestorage.app",
            messagingSenderId: "793700191025",
            appId: "1:793700191025:web:4272ade31590f5d0aebe10"
        };

        const app = initializeApp(firebaseConfig);
        
        window.auth = getAuth(app);
        window.db = getFirestore(app);
    </script>
</head>
<body>

<div class="bg-slider">
    <img src="pics/GlowArts/HomeDesk.png" alt="Background 1">
    <img src="pics/GlowArts/rimurutempest.png" alt="Background 2">
    <img src="pics/DigitalArts/Untitled17_20210515152642.png" alt="Background 3">
</div>
<div class="overlay"></div>

<div class="content-box">
    <!-- Center Hero Section (Logo + Text) -->
    <div class="hero-section">
        <img src="AeteraArtis2.png" alt="Aeterna Artis Logo" class="hero-logo">
        <h1 class="hero-title">See What the Art Community is Creating Right Now</h1>
        <p class="hero-subtitle">Log in to explore fresh masterpieces, follow trending creators, and save your favorites.</p>
    </div>

    <!-- Right Login Container -->
    <span class="container">
      <div class="card-header">
        <h2>LOGIN</h2>
      </div>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" placeholder="Enter Email" id="email" name="uname" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" placeholder="Enter Password" id="password" name="psw" required>
            </div>
            <div class="button-group">
                <input class="button" type="submit" value="Sign in"/>
                <input class="button button-secondary" type="reset" value="Forgot?"/>
            </div>
            <hr>
            <p class="signup-text">Need an account? <a href="Register.html">Sign up</a></p>
        </form>

        <script type="module">
          import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
          import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

          document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {
              const userCredential = await signInWithEmailAndPassword(window.auth, email, password);
              const user = userCredential.user;

              const userDocRef = doc(window.db, "users", user.uid);
              const userDocSnap = await getDoc(userDocRef);

              if (userDocSnap.exists()) {
                const userData = userDocSnap.data();
                userData.uid = user.uid;

                localStorage.setItem("userEmail", email);
                localStorage.setItem("userProfile", JSON.stringify(userData));

                alert("Welcome " + userData.fullname + "!");
                window.location.href = "Websitehtml.html";
              } else {
                alert("User profile record not found.");
              }
            } catch (error) {
              console.error("Login error:", error);
              alert("Login failed: " + error.message);
            }
          });
        </script>
    </span>

    <span class="footer">
        <p>Follow me on:</p>
        <div class="social-links">
            <a href="https://www.facebook.com/isaiah.sarcia.5" class="fa-brands fa-facebook-f"></a>
            <a href="https://twitter.com/isaiahsarcia" class="fa-brands fa-x-twitter"></a>
            <a href="https://www.pinterest.ph/sarciaisaiah02" class="fa-brands fa-pinterest-p"></a>
            <a href="https://www.instagram.com/isaiahsarcia/?hl=en" class="fa-brands fa-instagram"></a>
        </div>
        <hr>
        <small>&copy; Copyright 2021, Art:Gallery Cooperation. This site is for my project only.</small>
    </span>
</div>

</body>
</html>
