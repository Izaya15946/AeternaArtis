<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - Aeterna Artis</title>
  <link rel="shortcut icon" href="pics/logo/finishlogo2.0.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="Register.css">

  <!-- 1. Firebase Initialization Module -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBIefhfw87VtaK_BtSHli0OPAksm1wqQ1s",
      authDomain: "aeterna-artis-618a2.firebaseapp.com",
      projectId: "aeterna-artis-618a2",
      storageBucket: "aeterna-artis-618a2.firebasestorage.app",
      messagingSenderId: "793700191025",
      appId: "1:793700191025:web:4272ade31590f5d0aebe10"
    };

    const app = initializeApp(firebaseConfig);
    
    window.auth = getAuth(app);
    window.db = getFirestore(app);
  </script>
</head>

<body>

  <div class="bg-slider">
      <img src="pics/GlowArts/HomeDesk.png" alt="Background 1">
      <img src="pics/GlowArts/rimurutempest.png" alt="Background 2">
      <img src="pics/DigitalArts/Untitled17_20210515152642.png" alt="Background 3">
  </div>
  <div class="overlay"></div>

  <div class="content-box">
    <!-- Hero Section (Left side) -->
    <div class="hero-section">
      <img src="AeteraArtis2.png" alt="Aeterna Artis Logo" class="hero-logo">
      <h1 class="hero-title">Join Aeterna Artis</h1>
      <p class="hero-subtitle">Create an account to showcase, discover, and trade digital artwork.</p>
    </div>

    <!-- Right Side Register Card -->
    <div class="container">
      <div class="card-header">
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
        <h2>SIGN UP</h2>
      </div>
      
      <form id="registerForm" name="form1">
        <div class="input-group">
          <label for="reg-fullname">Full Name</label>
          <input type="text" id="reg-fullname" name="Fullname" placeholder="Enter Full Name" required>
        </div>

        <div class="form-row">
          <div class="input-group">
            <label for="birthday">Birthday</label>
            <input type="date" id="birthday" name="birthday" required>
          </div>

          <div class="input-group">
            <label for="reg-country">Country</label>
            <select id="reg-country" name="Country" class="select" required>
                <option value="" selected disabled>Select country</option>
                <option>Japan</option>
                <option>USA</option>
                <option>Philippines</option>
                <option>North Korea</option>
                <option>South Korea</option>
            </select>
          </div>
        </div>

        <div class="input-group">
          <label for="reg-uname">Email</label>
          <input type="email" id="reg-uname" placeholder="Enter Email" name="uname" required>
        </div>
        
        <div class="form-row">
          <div class="input-group">
            <label for="pass">Password</label>
            <input type="password" id="pass" placeholder="Password" name="psw" required>
          </div>
          
          <div class="input-group">
            <label for="re-pass">Re-Password</label>
            <input type="password" id="re-pass" placeholder="Confirm Password" name="re-psw" required>
          </div>
        </div>
        
        <div class="input-group">
          <label>Gender</label>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" name="gender" value="M" required/> Male</label>
            <label class="radio-label"><input type="radio" name="gender" value="F" required/> Female</label>
            <label class="radio-label"><input type="radio" name="gender" value="O" required/> Other</label>
          </div>
        </div>

        <hr>

        <p class="terms-text">By creating an account you agree to our <a href="#">Terms & Privacy</a>.</p>
        <div class="button-group">
          <input class="button" type="submit" value="Sign up"/>
          <input class="button button-secondary" type="reset" value="Reset"/>
        </div>
      </form>
    </div>

    <!-- Footer Section -->
    <div class="footer">
      <p>Follow me on:</p>
      <div class="social-links">
        <a href="https://www.facebook.com/isaiah.sarcia.5/" class="fa-brands fa-facebook-f"></a>
        <a href="#" class="fa-brands fa-x-twitter"></a>
        <a href="#" class="fa-brands fa-pinterest-p"></a>
        <a href="#" class="fa-brands fa-instagram"></a>
      </div>
      <hr>
      <small>&copy; Copyright 2021, Arts:Gallery Cooperation. This site is for my project only.</small>
    </div>
  </div>

  <!-- 2. Form Logic Module Script -->
  <script type="module">
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    document.getElementById("registerForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const pass = document.getElementById("pass").value;
      const rePass = document.getElementById("re-pass").value;

      if (pass !== rePass) {
        alert("Passwords do not match!");
        return;
      }

      const email = document.getElementById("reg-uname").value.trim();
      const fullname = document.getElementById("reg-fullname").value.trim();
      const birthday = document.getElementById("birthday").value;
      const country = document.getElementById("reg-country").value;
      const genderRadio = document.querySelector('input[name="gender"]:checked');
      const gender = genderRadio ? genderRadio.value : "";

      try {
        const userCredential = await createUserWithEmailAndPassword(window.auth, email, pass);
        const user = userCredential.user;

        await setDoc(doc(window.db, "users", user.uid), {
          fullname: fullname,
          birthday: birthday,
          country: country,
          email: email,
          gender: gender,
          imageUrl: "",
          createdAt: serverTimestamp()
        });

        alert("Registered successfully!");
        window.location.href = "index.html";
      } catch (error) {
        console.error("Registration error:", error);
        alert("Error: " + error.message);
      }
    });
  </script>
</body>
</html>
